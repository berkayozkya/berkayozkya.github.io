<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berkay Apps</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 2rem;
        }
        .app-card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .app-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
        }
        .app-desc {
            color: #cbd5e1;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <h1>Berkay Apps</h1>
    <p>Welcome to the official home of Berkay Apps. Creating fun and engaging mobile experiences.</p>
    
    <div class="app-card">
        <div class="app-title">Trick Shot - Ball</div>
        <div class="app-desc">Draw, aim, and shoot the neon ball into the goal in this physics-based puzzle game!</div>
    </div>
</body>
</html>
