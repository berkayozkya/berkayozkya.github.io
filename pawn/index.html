<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pawn Shop Boss</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #090d0e;
        color: #f5efe3;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 28% 22%, rgba(137, 87, 31, 0.34), transparent 36%),
          linear-gradient(135deg, #111719 0%, #0b0f10 44%, #1c1309 100%);
      }

      main {
        width: min(720px, calc(100% - 40px));
        padding: 34px;
        border: 1px solid rgba(214, 155, 76, 0.42);
        border-radius: 8px;
        background: rgba(8, 13, 14, 0.9);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.56);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(34px, 7vw, 64px);
        line-height: 0.96;
      }

      p {
        color: #d7cbbb;
        font-size: 18px;
        line-height: 1.55;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }

      a {
        color: #ffe0a3;
      }

      nav a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 0 18px;
        border: 1px solid rgba(214, 155, 76, 0.72);
        border-radius: 6px;
        background: #5b3312;
        color: #fff4df;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pawn Shop Boss</h1>
      <p>
        Run a pawn shop, inspect risky items, negotiate deals, manage storage,
        upgrade your business, and build your reputation.
      </p>
      <nav>
        <a href="./support/">Support</a>
        <a href="./privacy/">Privacy Policy</a>
      </nav>
    </main>
  </body>
</html>
